version: '3.9'

services:
  # ─── PostgreSQL Database ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: legalaid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legalaid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legalaid_secure_pw_2026}
      POSTGRES_DB: ${POSTGRES_DB:-legalaid}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U legalaid']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache & Rate Limiter ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: legalaid-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-legalaid_redis_pw_2026} --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-legalaid_redis_pw_2026}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── NestJS Backend API ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legalaid-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-legalaid}:${POSTGRES_PASSWORD:-legalaid_secure_pw_2026}@postgres:5432/${POSTGRES_DB:-legalaid}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-legalaid_redis_pw_2026}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-CHANGE_THIS_TO_A_RANDOM_64_CHAR_STRING_IN_PRODUCTION}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-60m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_TIMEOUT_MS: ${GEMINI_API_TIMEOUT_MS:-45000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - '127.0.0.1:4000:4000'

  # ─── Next.js Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    container_name: legalaid-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
